name: 🔍 Audit Complet Saptamanal

on:
  schedule:
    # Duminica 01:00 UTC = 03:00 Romania
    - cron: '0 1 * * 0'
  workflow_dispatch:
    inputs:
      skip_links:
        description: 'Skip link checking (faster)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  audit:
    name: Full Site Audit
    runs-on: ubuntu-latest
    # Deadline-ul intern al verificării de linkuri e 960s (link_checker.GLOBAL_DEADLINE);
    # 25 min lasă loc pentru setup + restul check-urilor, ca la link-checker.yml.
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create directories
        run: mkdir -p logs data

      - name: Run full audit
        env:
          SITE_URL: https://ghidulreducerilor.ro
        run: |
          SKIP_LINKS="${{ github.event.inputs.skip_links || 'false' }}"
          if [ "$SKIP_LINKS" = "true" ]; then
            python scripts/audit_full.py --skip-links || true
          else
            python scripts/audit_full.py || true
          fi

      - name: Commit audit results
        run: |
          git config user.name "GhidulReducerilor Bot"
          git config user.email "bot@ghidulreducerilor.ro"
          # logs/ e gitignored: raportul audit e singura excepție versionată (-f).
          git add -f logs/audit_full_latest.json || true
          [ -f AUDIT_LOG.md ] && git add AUDIT_LOG.md || true
          git diff --staged --quiet || git commit -m "🔍 Audit report $(date +%Y-%m-%d)"

      - name: Push results
        run: |
          # Rebase: main poate primi alte commit-uri în cele ~17 min de audit.
          git pull --rebase origin main
          git push
