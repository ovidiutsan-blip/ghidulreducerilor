name: 📱 Social Media Posts

on:
  schedule:
    # Minutul :23 evită vârful de load GitHub de la :00 (întârzieri de ore / rulări sărite).
    # Dimineață: 06:23 UTC = 09:23 România (vara)
    - cron: '23 6 * * *'
    # Prânz (L-V): 11:23 UTC = 14:23 România
    - cron: '23 11 * * 1-5'
    # Seară: 17:23 UTC = 20:23 România
    - cron: '23 17 * * *'
  workflow_dispatch:
    inputs:
      session:
        description: 'Sesiune postare'
        required: false
        default: 'morning'
        type: choice
        options:
          - morning
          - afternoon
          - evening
      dry_run:
        description: 'Dry run (nu postează)'
        required: false
        default: false
        type: boolean

jobs:
  social-post:
    name: Social Media Post
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v5

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalare dependențe
        run: pip install -r requirements.txt

      - name: 📁 Creare directoare
        run: mkdir -p logs data

      - name: 📱 Postare Facebook + Instagram + script TikTok
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          # Sesiunea vine din cron-ul care a declanșat rularea, NU din ora curentă:
          # GitHub întârzie cron-urile cu ore întregi, iar ora curentă ar mapa greșit sesiunea.
          SCHEDULE="${{ github.event.schedule }}"
          if [ -n "${{ github.event.inputs.session }}" ]; then
            SESSION="${{ github.event.inputs.session }}"
          elif [ "$SCHEDULE" = "23 6 * * *" ]; then
            SESSION="morning"
          elif [ "$SCHEDULE" = "23 11 * * 1-5" ]; then
            SESSION="afternoon"
          else
            SESSION="evening"
          fi

          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          echo "Sesiune: $SESSION"
          python scripts/social_media_poster.py --session $SESSION $DRY_RUN_FLAG

      - name: 💬 Postare Telegram (top 5 deals)
        # Rulează doar la sesiunea de dimineață (07:00 UTC = 09:00 RO) ca să evită spam.
        if: github.event.schedule == '23 6 * * *' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "⚠️  TELEGRAM_BOT_TOKEN lipsește — skip Telegram. Setează secret-ul în repo settings."
            exit 0
          fi
          python agents/marketing/telegram_agent.py
